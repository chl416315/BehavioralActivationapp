<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="description" content="해야 할 일이 있어도 숏폼만 보고 있는 당신. 한 달 만에 개과천선.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="행동활성화">
<title>행동활성화 기법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-sized deck. Top bar (day + tools) → story-style progress → one card filling the screen → back / next bar.
   Nothing scrolls vertically; you move through cards with buttons or a swipe. */
:root{
  --bg:#E7EBF0;
  --card:#FFFFFF;
  --ink:#14171C;
  --sub:#5F6773;
  --faint:#9AA1AC;
  --line:#E2E6EC;
  --soft:#F1F3F6;
  --write:#4C78D0;
  --choose:#2F9A6E;
  --do:#E06A2E;
  --review:#7E5FCC;
  --extra:#6E7887;
  --warn:#B4531C;
  --shadow:0 1px 2px rgba(20,23,28,.05),0 12px 32px -12px rgba(20,23,28,.18);
  --serif:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014; --card:#181B21; --ink:#ECEEF2; --sub:#A0A7B2; --faint:#666E7A; --line:#2A2E36; --soft:#21252C;
    --write:#77A2F2; --choose:#5CC294; --do:#F28A50; --review:#A68BEA; --extra:#8E98A6; --warn:#F2A06C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014; --card:#181B21; --ink:#ECEEF2; --sub:#A0A7B2; --faint:#666E7A; --line:#2A2E36; --soft:#21252C;
  --write:#77A2F2; --choose:#5CC294; --do:#F28A50; --review:#A68BEA; --extra:#8E98A6; --warn:#F2A06C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);background:var(--bg)}
body{height:100%;margin:0;word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac,var(--ink));outline-offset:2px}

.app{--ac:var(--extra);height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 14px}
.app[data-ph="write"]{--ac:var(--write)} .app[data-ph="choose"]{--ac:var(--choose)} .app[data-ph="do"]{--ac:var(--do)}
.app[data-ph="review"]{--ac:var(--review)} .app[data-ph="start"]{--ac:var(--do)} .app[data-ph="extra"],.app[data-ph="help"]{--ac:var(--extra)}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;min-height:44px}
.daypill{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px 8px 10px;font-weight:600;font-size:14px}
.daypill .ph{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ac);color:var(--card);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.daypill .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daypill svg{flex:none;opacity:.6}
.grow{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg{width:19px;height:19px}
.prog{display:flex;gap:4px;margin:14px 4px 12px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .25s}
.prog i.on{background:var(--ink)}
.prog i.cur{background:var(--ac)}

/* stage & card */
.stage{flex:1;min-height:0;position:relative;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:26px 22px 22px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card.in-r{animation:inR .26s cubic-bezier(.2,.8,.2,1)} .card.in-l{animation:inL .26s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);margin:0 0 10px}
.q{font-family:var(--serif);font-weight:700;font-size:clamp(1.3rem,5.6vw,1.6rem);line-height:1.42;letter-spacing:-.01em;margin:0;text-wrap:balance}
.qsub{color:var(--sub);margin:10px 0 0;font-size:14px;line-height:1.65}
.body{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.body.center{flex:1;justify-content:center}
.spacer{flex:1}
.note{font-size:13px;color:var(--sub);margin:0}
.note b{color:var(--ink)}
.callout{border-radius:16px;background:color-mix(in srgb,var(--ac) 10%,var(--card));padding:14px 16px;font-size:14px;line-height:1.6}

/* inputs */
.in{width:100%;min-width:0;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:13px 15px;font:500 17px/1.4 var(--sans);color:var(--ink);transition:border-color .15s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--ac);background:var(--card)}
textarea.in{resize:none;min-height:7.5rem}
.lbl{font-size:12.5px;font-weight:600;color:var(--sub);margin:4px 0 -4px 2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

/* choices */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid transparent;background:var(--soft);border-radius:16px;padding:13px 14px;font-size:15px;font-weight:500;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub)}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt small{display:block;color:var(--sub);font-weight:400;font-size:12.5px}
.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.opt.on .mk{background:var(--ac);border-color:var(--ac);color:var(--card)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .opt{flex-direction:column;justify-content:center;gap:6px;padding:22px 10px;font-size:17px;font-weight:700;text-align:center}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500}
.tag.on{border-color:var(--ac);background:var(--ac);color:var(--card)}
.tag.ghost{border-style:dashed;color:var(--sub)}

/* 0~10 meter */
.meter{display:flex;flex-direction:column;gap:10px}
.mnum{font-family:var(--serif);font-weight:700;font-size:4.2rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:6px}
.mnum .dash{color:var(--line)}
.mnum small{font-size:1.1rem;color:var(--faint);margin-left:4px}
.cells{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.cell{height:46px;border:0;border-radius:8px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;padding:0}
.cell:first-child{border-radius:12px 6px 6px 12px} .cell:last-child{border-radius:6px 12px 12px 6px}
.cell.fill{background:color-mix(in srgb,var(--ac) 30%,var(--soft));color:var(--ink)}
.cell.on{background:var(--ac);color:var(--card)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.meter.sm .cell{height:38px;font-size:11.5px}
.mhead{display:flex;justify-content:space-between;align-items:baseline}
.mhead b{font-size:14px}
.mhead span{font-family:var(--serif);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}

/* entry log */
.tl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.tl::-webkit-scrollbar{display:none}
.tl .tag{flex:none;font-variant-numeric:tabular-nums}
.entry-foot{display:flex;justify-content:space-between;align-items:center}
.link{border:0;background:none;padding:4px 0;color:var(--sub);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link.ac{color:var(--ac);font-weight:600}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 14px;border-radius:14px;background:var(--soft)}
.list li span:first-child{min-width:0;overflow-wrap:anywhere}
.list .meta{flex:none;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.list .x{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:0 2px}
.minihead{font-size:12.5px;font-weight:700;color:var(--sub);margin:6px 0 -2px}

/* ladder graphic */
.rungs{display:flex;flex-direction:column-reverse;gap:4px;margin-top:2px}
.rung{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--faint)}
.rung i{display:block;height:6px;border-radius:3px;background:var(--line)}
.rung.on{color:var(--ink);font-weight:700} .rung.on i{background:var(--ac)}
.rung.done i{background:color-mix(in srgb,var(--ac) 40%,var(--line))}
.warn{color:var(--warn);font-size:13px;margin:0}

/* hero */
.card.hero{justify-content:center;align-items:center;text-align:center;gap:28px}
.hero-art{width:min(72%,260px);height:auto;display:block}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,9vw,2.6rem);line-height:1.2;margin:0;letter-spacing:-.02em}
.hero .tiny{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ac);margin:0 0 10px}
.hero-art .s{fill:color-mix(in srgb,var(--do) 22%,var(--soft))}
.hero-art .s.top{fill:var(--do)}
.hero-art .pole{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.hero-art .flag{fill:var(--ink)}
@media (prefers-reduced-motion: no-preference){ .hero-art .s{animation:rise .6s cubic-bezier(.2,.8,.2,1) both} .hero-art .s:nth-child(2){animation-delay:.08s} .hero-art .s:nth-child(3){animation-delay:.16s} .hero-art .s:nth-child(4){animation-delay:.24s} .hero-art .s:nth-child(5){animation-delay:.32s} }
@keyframes rise{from{transform:translateY(14px);opacity:0}}

/* persuasion */
.big-q{font-family:var(--serif);font-weight:700;font-size:clamp(1.45rem,6.4vw,1.8rem);line-height:1.38;margin:0;letter-spacing:-.015em;text-wrap:balance}
.big-q em{font-style:normal;color:var(--ac)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;padding:8px 4px}
.vs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.vs figcaption{font-size:12.5px;color:var(--sub);text-align:center;line-height:1.4}
.vs figcaption b{display:block;color:var(--ink);font-size:13.5px}
.boulder{width:86px;height:118px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub)}
.mini-stairs{display:flex;align-items:flex-end;gap:3px;height:118px}
.mini-stairs i{display:block;width:16px;border-radius:5px;background:color-mix(in srgb,var(--ac) 26%,var(--soft))}
.mini-stairs i:first-child{background:var(--ac)}
.arrow{color:var(--faint);font-size:20px;padding-bottom:50px}
.why{border:0;background:none;padding:0;color:var(--sub);font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;border-radius:16px;padding:16px}
.cmp-row .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.cmp-row small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:2px}
.cmp-row.no{background:var(--soft)} .cmp-row.no .ic{background:var(--line);color:var(--sub)} .cmp-row.no span:last-child{color:var(--sub)} .cmp-row s{text-decoration-color:var(--faint)}
.cmp-row.yes{background:color-mix(in srgb,var(--ac) 11%,var(--card));box-shadow:inset 0 0 0 1.5px var(--ac)} .cmp-row.yes .ic{background:var(--ac);color:var(--card)} .cmp-row.yes span:last-child{font-weight:700;font-size:16px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ba .h{font-size:12px;font-weight:700;color:var(--sub);padding:0 4px}
.ba .h.after{color:var(--ac)}
.ba .c{border-radius:14px;padding:12px;font-size:13.5px;line-height:1.45;background:var(--soft);color:var(--sub)}
.ba .c.after{background:color-mix(in srgb,var(--ac) 11%,var(--card));color:var(--ink);font-weight:600}
.ba .k{grid-column:1 / -1;font-size:11.5px;font-weight:700;color:var(--faint);margin:6px 0 -2px 4px;letter-spacing:.04em}

/* goal stairs */
.stairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.stairs li{display:flex;align-items:center;gap:10px;padding-left:calc(var(--k) * 16px);min-width:0}
.tread{flex:none;width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--sub)}
.stairs li.past .tread{background:color-mix(in srgb,var(--ac) 30%,var(--soft));color:var(--ink)}
.stairs li.cur .tread{background:var(--ac);color:var(--card)}
.stairs li.goal .tread{background:var(--ink);color:var(--card)}
.stairs li.goal .tread svg{width:15px;height:15px}
.sl{font-size:14px;min-width:0;line-height:1.35;color:var(--sub)}
.stairs li.cur .sl,.stairs li.goal .sl{color:var(--ink);font-weight:600}
.sl small{display:block;font-size:11px;color:var(--faint);font-weight:600}
.sl em{font-style:normal;color:var(--ac);font-weight:700;font-size:12px;margin-left:6px}
.ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ex-list li{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--soft);font-size:14px}
.ex-list .t{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.ex-list .sc{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.demo{border-radius:20px;background:var(--soft);padding:18px;display:flex;flex-direction:column;gap:12px}
.demo-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub)}
.demo-top b{color:var(--ink);font-size:15px}
.demo-moods{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}
.demo-moods div{font-family:var(--serif);font-weight:700;font-size:2.4rem;line-height:1}
.demo-moods small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--sub);font-weight:600;margin-top:4px}
.demo-moods .up{color:var(--ac)}

/* flip cards */
.flip{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1.5px dashed var(--line);border-radius:22px;padding:24px 18px;background:none;width:100%}
.flip .no{font-family:var(--serif);font-size:3rem;font-weight:700;color:var(--line);line-height:1}
.flip .tt{font-family:var(--serif);font-weight:700;font-size:1.5rem;margin-top:10px}
.flip .hint{font-size:12.5px;color:var(--sub);margin-top:8px}
.back-face{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:16px;line-height:1.75}
.back-face p{margin:0}

/* chart / stats */
.chart{position:relative;width:100%;flex:1;min-height:220px}
.chart svg{display:block;max-width:100%}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .sep{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax,.chart .xl{fill:var(--faint);font-size:10.5px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.chart .xl.now{fill:var(--ink);font-weight:700}
.chart .bl{font-size:11px;font-weight:700;font-family:var(--sans)}
.chart .ln{fill:none;stroke:var(--faint);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke:var(--card);stroke-width:2}
.chart .pt.miss{fill:var(--card);stroke:var(--extra);stroke-width:2.2}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--sans)}
.f-write{fill:var(--write)} .f-choose{fill:var(--choose)} .f-do{fill:var(--do)} .f-extra{fill:var(--extra)}
.chart-empty{position:absolute;inset:40px 10px 30px 30px;display:grid;place-items:center;color:var(--sub);font-size:13.5px;text-align:center;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.sw-write{background:var(--write)} .sw-choose{background:var(--choose)} .sw-do{background:var(--do)} .sw-extra{background:var(--extra)}
.sw-miss{background:var(--card);box-shadow:inset 0 0 0 2px var(--extra)}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:16px;border-radius:18px;background:var(--soft)}
.stat b{font-size:14.5px}
.stat small{display:block;color:var(--sub);font-size:12px;font-weight:400}
.stat .big{grid-row:span 2;font-family:var(--serif);font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.stat .big small{font-family:var(--sans);font-size:11px;text-align:right}
.stat.hl{background:color-mix(in srgb,var(--do) 12%,var(--card))}

/* bottom nav */
.nav{display:flex;align-items:center;gap:10px;padding-top:14px}
.navb{width:54px;height:54px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.navb:disabled{opacity:.35;cursor:default}
.next{flex:1;height:54px;border:0;border-radius:27px;background:var(--ink);color:var(--card);font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.next svg,.navb svg{width:18px;height:18px}
.count{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}

/* day sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.42);z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:11;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet-top h3{font-family:var(--serif);font-size:1.35rem;margin:0}
.status{font-size:12px;color:var(--sub)}
.status[data-s="error"],.status[data-s="readonly"]{color:var(--warn)}
.grp{margin-top:16px}
.grp-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--gc);margin-bottom:8px}
.grp-h small{font-weight:400;color:var(--sub)}
.g-start{--gc:var(--extra)} .g-write{--gc:var(--write)} .g-choose{--gc:var(--choose)} .g-do{--gc:var(--do)} .g-extra{--gc:var(--extra)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{position:relative;height:44px;border:0;border-radius:12px;background:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.dchip.has::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gc)}
.dchip.today{box-shadow:inset 0 0 0 2px var(--gc)}
.dchip.sel{background:var(--gc);color:var(--card)}
.dchip.sel.has::after{background:var(--card)}
.sheet-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.sheet-links button{border:0;background:var(--soft);border-radius:14px;padding:14px;font-weight:600;text-align:left}
.sheet-links small{display:block;font-weight:400;color:var(--sub);font-size:12px}

@media (min-width:600px){ .app{padding-top:24px;padding-bottom:24px} }
@media (prefers-reduced-motion: reduce){ .card.in-r,.card.in-l,.sheet,.scrim{animation:none} .rain i{animation:none;display:none} }

<body>

<div class="app" id="app" data-ph="start">
  <div class="bar" id="bar"></div>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="overlay"></div>

<script>
(function(){
'use strict';
var MAXDAY = 28, S = {}, mode = 'loading', DB = null, loaded = false;
var view = {ctx:0, idx:0, entry:{}, flipped:{}, sheet:false};
var LS_KEY = 'bwnw-log-v1';

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function num(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
function pad(n){ return String(n).padStart(2,'0'); }
function dayPath(n){ return 'days/d' + pad(n); }
function get(p){ return S[p] || {}; }
function doc(p){ return S[p] || (S[p] = {}); }
function D(n){ return get(dayPath(n)); }
function fid(p,f,v){ return ('f-' + p + '-' + f + (v !== undefined ? '-' + v : '')).replace(/[^A-Za-z0-9_-]/g,'-'); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
var IC = {
  down:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 4 3 6-7"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 4.5-6 7.6-6 10a6 6 0 0012 0c0-2.4-2-5.5-6-10z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- dates ---------- */
var WD = '일월화수목금토';
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseISO(s){ var a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function todayISO(){ return iso(new Date()); }
function startISO(){ var s = get('journal/setup').start; return /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s : todayISO(); }
function dateOf(n){ var d = parseISO(startISO()); d.setDate(d.getDate() + n - 1); return d; }
function todayNum(){ var diff = Math.round((parseISO(todayISO()) - parseISO(startISO())) / 864e5); return Math.max(0, Math.min(MAXDAY, diff + 1)); }
function shortDate(d){ return (d.getMonth()+1) + '.' + d.getDate() + ' ' + WD[d.getDay()]; }
function dayLabel(n){ return n === 0 ? '시작 전' : n + '일차'; }

/* ---------- deep get/set ---------- */
function getDeep(o, path){ return path.split('.').reduce(function(a,k){ return a == null ? undefined : a[k]; }, o); }
function setDeep(o, path, val){
  var ks = path.split('.'), c = o;
  for (var i = 0; i < ks.length - 1; i++){
    var k = ks[i];
    if (c[k] == null || typeof c[k] !== 'object') c[k] = /^\d+$/.test(ks[i+1]) ? [] : {};
    c = c[k];
  }
  var last = ks[ks.length-1];
  if (Array.isArray(c)){
    c[last] = (val === undefined || val === null) ? '' : val;
    for (var j = 0; j < c.length; j++) if (c[j] === undefined) c[j] = null;
  } else if (val === '' || val === null || val === undefined) delete c[last];
  else c[last] = val;
}
function stable(v){
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

/* ---------- status & saving ---------- */
var statusState = {s:'loading', msg:''};
function status(s, msg){
  statusState = {s:s, msg:msg || ''};
  var el = $('#status'); if (el) paintStatus(el);
}
function statusText(){
  var s = statusState.s;
  if (s === 'saved'){ var d = new Date(); return '저장됨 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  return {loading:'불러오는 중', saving:'저장 중…', local:'이 기기에 저장됨', db:'자동 저장', readonly:'보기 전용', error:statusState.msg || '저장하지 못했어요'}[s] || '';
}
function paintStatus(el){ el.dataset.s = statusState.s; el.textContent = statusText(); }

var timers = {}, inflight = {}, chains = {}, pending = {};
function markDirty(p){
  clearTimeout(timers[p]);
  timers[p] = setTimeout(function(){ delete timers[p]; flush(p); }, 600);
  if (mode !== 'readonly') status('saving');
}
function flush(p){
  var o = doc(p);
  o.updatedAt = new Date().toISOString();
  if (mode === 'local'){ saveLocal(); status('local'); return; }
  if (mode !== 'db'){ pending[p] = true; return; }
  var data = JSON.parse(JSON.stringify(o));
  inflight[p] = (inflight[p] || 0) + 1;
  chains[p] = (chains[p] || Promise.resolve())
    .then(function(){ return writeOnce(p, data); })
    .then(function(){ if (!Object.keys(timers).length && mode === 'db') status('saved'); }, onWriteErr)
    .then(function(){ inflight[p]--; });
}
function writeOnce(p, data){
  return DB.doc(p).set(data).catch(function(e){
    if (e && e.code === 'unavailable') return sleep(600 + Math.random()*900).then(function(){ return DB.doc(p).set(data); });
    throw e;
  });
}
function onWriteErr(e){
  var c = e && e.code;
  if (c === 'invalid_argument' || c === 'not_granted' || c === 'transform_error'){ mode = 'readonly'; status('readonly'); render(); }
  else if (c === 'quota_exceeded') status('error', '저장 공간이 가득 찼어요');
  else if (c === 'revoked' || c === 'capability_disabled' || c === 'capability_removed') status('error', '연결이 끊겼어요. 다시 열어 주세요');
  else status('error', '저장하지 못했어요. 잠시 뒤 다시 적어 주세요');
}
function loadLocal(){ try{ var o = JSON.parse(lsGet(LS_KEY) || '{}'); for (var k in o) S[k] = o[k]; }catch(e){} }
function saveLocal(){ lsSet(LS_KEY, JSON.stringify(S)); }
function applySnap(col, snap){
  var changed = false;
  snap.docs.forEach(function(d){
    var p = col + '/' + d.id;
    if (timers[p] || inflight[p] || pending[p]) return;
    var data = d.data() || {};
    if (stable(data) !== stable(S[p] || null)){ S[p] = JSON.parse(JSON.stringify(data)); changed = true; }
  });
  if (changed && loaded) render();
}

/* ---------- edits ---------- */
function ensureStart(p){
  var s = doc('journal/setup');
  if (!s.start){ s.start = todayISO(); if (p !== 'journal/setup') markDirty('journal/setup'); }
}
function ladder(){ var L = get('journal/choose').ladder || []; return [0,1,2,3,4].map(function(i){ return L[i] || {}; }); }
function dayNumOf(p){ return parseInt(p.slice(-2), 10); }
function seedDay(p){
  var n = dayNumOf(p); if (n < 7) return;
  var o = doc(p); if (o.seeded) return;
  o.seeded = true;
  var pr = D(n-1);
  if (o.step == null && pr.nextStep != null){ o.step = pr.nextStep; if (pr.nextStepText) o.stepText = pr.nextStepText; }
  if (!o.time && pr.nextTime) o.time = pr.nextTime;
}
function effStep(n){ var o = D(n); if (o.step != null) return num(o.step); if (!o.seeded && n >= 7) return num(D(n-1).nextStep); return null; }
function effTime(n){ var o = D(n); if (o.time) return o.time; if (!o.seeded && n >= 7) return D(n-1).nextTime || ''; return ''; }
function curVal(p, f){
  if (p.indexOf('days/') === 0 && f === 'step') return effStep(dayNumOf(p));
  return getDeep(get(p), f);
}
function edit(p, f, v, rerender){
  if (mode === 'readonly') return;
  ensureStart(p);
  var o = doc(p);
  if (p.indexOf('days/') === 0) seedDay(p);
  setDeep(o, f, v);
  if (f === 'step' || f === 'nextStep'){
    var L = ladder(), t = (typeof v === 'number' && L[v-1] && L[v-1].text) || '';
    setDeep(o, f + 'Text', t);
  }
  markDirty(p);
  if (rerender) render();
}
function parseVal(v){ if (v === 'true') return true; if (v === 'false') return false; if (/^\d+$/.test(v)) return parseInt(v, 10); return v; }
function nextHour(t){ var m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return ''; var h = +m[1] + 1; return h > 24 ? '' : pad(h) + ':' + m[2]; }

/* ---------- builders ---------- */
function inp(p, f, val, ph, extra){
  return '<input class="in" id="' + fid(p,f) + '" data-doc="' + p + '" data-f="' + f + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '" autocomplete="off" ' + (extra || '') + '>';
}
function area(p, f, val, ph, extra){
  return '<textarea class="in" id="' + fid(p,f) + '" data-doc="' + p + '" data-f="' + f + '" placeholder="' + esc(ph || '') + '" ' + (extra || '') + '>' + esc(val) + '</textarea>';
}
function opt(p, f, v, label, cur, mark, sub){
  var on = cur === v;
  return '<button type="button" id="' + fid(p,f,String(v)) + '" class="opt' + (on ? ' on' : '') + '" data-doc="' + p + '" data-f="' + f + '" data-v="' + v + '" aria-pressed="' + on + '"><span class="mk">' + (on ? '✓' : (mark || '')) + '</span><span class="tx">' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span></button>';
}
function tag(p, f, v, label, cur){
  var on = cur === v;
  return '<button type="button" id="' + fid(p,f,String(v)) + '" class="tag' + (on ? ' on' : '') + '" data-doc="' + p + '" data-f="' + f + '" data-v="' + v + '" aria-pressed="' + on + '">' + label + '</button>';
}
function cells(p, f, cur){
  var h = '<div class="cells" role="group" aria-label="0~10">';
  for (var i = 0; i <= 10; i++){
    var on = cur === i, fill = cur != null && i < cur;
    h += '<button type="button" id="' + fid(p,f,i) + '" class="cell' + (on ? ' on' : fill ? ' fill' : '') + '" data-doc="' + p + '" data-f="' + f + '" data-v="' + i + '" aria-pressed="' + on + '">' + i + '</button>';
  }
  return h + '</div>';
}
function meter(p, f, cur, lo, hi){
  return '<div class="meter"><div class="mnum">' + (cur == null ? '<span class="dash">–</span>' : cur + '<small>/10</small>') + '</div>' + cells(p, f, cur) +
    '<div class="ends"><span>' + lo + '</span><span>' + hi + '</span></div></div>';
}
function meterSm(p, f, cur, label){
  return '<div class="meter sm"><div class="mhead"><b>' + label + '</b><span>' + (cur == null ? '–' : cur) + '</span></div>' + cells(p, f, cur) + '</div>';
}
function C(o){ return o; } /* card: {kick, q, sub, body, cls, center} */

/* ---------- phases ---------- */
function phaseOf(n){ return n === 0 ? 'start' : n <= 4 ? 'write' : n <= 6 ? 'choose' : n <= 14 ? 'do' : 'extra'; }
var PH = {start:{no:'0', label:'시작 전', range:'0일차'}, write:{no:'1', label:'적기', range:'1~4일'},
  choose:{no:'2', label:'고르기', range:'5~6일'}, do:{no:'3', label:'하기', range:'7~14일'}, extra:{no:'+', label:'이어 하기', range:'15~28일'}};

var QS = ['쉬어야 힘이 날 것 같아 하루 종일 누워 있었는데, 더 기운이 빠진 적 있나요?',
  '여유 좀 생기면 운동해야지 생각만 하고, 몇 달째 시작을 못 하고 있나요?',
  '해야 할 일이 있어도 시작할 기분이 안 나서, 스마트폰만 잡고 있던 적 있나요?'];
var EX = [['11:00','눈 떴는데 침대에서 안 나옴',2,1],['12:00','쇼츠',3,0],['13:00','쇼츠',2,0],['14:00','친구 카톡 확인, 답장 안 함',1,6],
  ['15:00','누워서 천장 봄',1,0],['16:00','누워 있음, 월요일 보고서 생각남',0,8],['17:00','편의점 다녀옴, 컵라면',5,4],['18:00','컵라면 먹으며 예능',6,2],
  ['19:00','예능',4,2],['20:00','샤워',6,5],['21:00','동생이랑 통화 20분',7,6],['22:00','누워서 폰',3,0],['23:00','폰',2,0],['24:00','잠','','']];
var AREAS = [
  {k:'rel', n:'인간관계', ex:['친구에게 카톡 한 줄 보내기','점심시간에 옆자리 동료에게 같이 먹자고 하기','취미 모임 앱에서 검색해 보기']},
  {k:'work', n:'일과 공부', ex:['채용 공고 3개 저장하기','이력서 파일 열어서 경력 한 줄 고치기','오늘 배운 것 한 줄 적기']},
  {k:'leisure', n:'여가생활', ex:['유튜브에서 기타 채널 구독하기','옷장 위에서 기타 꺼내기','코드 하나만 잡아 보기']},
  {k:'health', n:'몸과 마음 건강', ex:['해 보고 싶은 운동 세 개 적기','현관문 나가서 10분 걷기','원데이 체험 하나 예약하기']},
  {k:'home', n:'집안일과 생활관리', sub:'청소, 빨래, 장보기, 공과금', ex:['싱크대 컵 3개 씻기','빨래 돌리기 버튼 누르기','공과금 앱 열어서 금액 확인하기']}
];
var GOALS = [
  {k:'fit', n:'운동', ph:'예) 주 3회 헬스장 가기', L:['운동화 끈만 매고 현관에 서기','집 앞 5분 걷기','10분 걷기','운동 원데이 체험 예약하기','체험 가서 1시간 해 보기']},
  {k:'study', n:'공부', ph:'예) 자격증 시험 합격', L:['책 펴고 딱 1줄만 읽기','1페이지 읽기','타이머 15분 공부','문제 5개 풀기','하루 1단원 끝내기']},
  {k:'job', n:'이직', ph:'예) 원하는 회사에 지원하기', L:['채용 공고 1개 저장하기','이력서 파일 열고 한 줄 고치기','경력 한 항목 다시 쓰기','지원서 1곳 작성하기','1곳 제출하기']},
  {k:'proj', n:'프로젝트', ph:'예) 사이드 프로젝트 완성', L:['문서 켜고 제목만 쓰기','목차 3줄 쓰기','첫 단락 쓰기','초안 절반 쓰기','초안 완성하기']},
  {k:'clean', n:'청소', ph:'예) 깨끗한 방에서 지내기', L:['싱크대 컵 3개 씻기','책상 위 물건 하나 치우기','바닥 물건 10개 정리','방 한 구석 치우기','방 전체 청소하기']}
];
function goalOf(){ var s = get('journal/setup'); return {cat: s.goalCat || '', text: s.goal || '', g: GOALS.filter(function(x){ return x.k === s.goalCat; })[0] || GOALS[0]}; }
var FLAG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h1.8v18H6z"/><path d="M8 4h10l-2.6 4L18 12H8z"/></svg>';
function stairs(goal, labels, cur){
  var h = '<ol class="stairs"><li class="goal" style="--k:5"><span class="tread">' + FLAG + '</span><span class="sl"><small>최종 목표</small>' + esc(goal || '내 진짜 목표') + '</span></li>';
  for (var i = 4; i >= 0; i--){
    var n = i + 1;
    h += '<li class="' + (n === cur ? 'cur' : n < cur ? 'past' : '') + '" style="--k:' + i + '"><span class="tread">' + n + '</span><span class="sl">' + esc(labels[i] || '') + (n === cur ? '<em>지금</em>' : '') + '</span></li>';
  }
  return h + '</ol>';
}
var CHECKS = ['남이 봐도 했는지 알 수 있다', '몇 번 했는지 셀 수 있다', '더 쪼갤 수 없을 만큼 작다'];
var LPH = ['해 보고 싶은 운동 세 개 적기', '클라이밍장 체험 가격 검색', '10분 걷기', '원데이 체험 예약하기', '예약한 체험 가서 1시간 해 보기'];
function ladderWarn(x){ return !!(x.text && !(x.c0 && x.c1 && x.c2)); }

/* ---------- day decks ---------- */
function moodCard(n){
  return C({kick:'잠자기 전에', q:'오늘 하루 기분은 몇 점이었나요?', body:'<div class="spacer"></div>' + meter(dayPath(n), 'mood', num(D(n).mood), '바닥', '최고') + '<div class="spacer"></div>', center:true});
}
function memoCard(n, ph){
  return C({kick:'오늘 메모', q:'한 줄만 남겨 둘까요?', sub:'하기 싫었던 순간, 의외로 괜찮았던 순간 무엇이든.', body:area(dayPath(n), 'memo', D(n).memo, ph || '예) 9시 되니까 하기 싫었는데 폰 메모장 열고 3분 걸림.')});
}
var CMP = [

function drawChart(){
  var box = $('#chart'); if (!box) return;

  var last = 14, n;
  for (n = 15; n <= MAXDAY; n++) if (num(D(n).mood) != null) last = n;
  var Lp = 24, Rp = 10, T = 38, B = 26, iw = W - Lp - Rp, ih = H - T - B, sp = iw / (last - 1), half = sp / 2;
  function x(n){ return Lp + (n - 1) * sp; }
  function y(v){ return T + (10 - v) * ih / 10; }

  for (var v = 0; v <= 10; v += 5) s += '<line class="g" x1="' + Lp + '" x2="' + (W - Rp) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (Lp - 7) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';

    if (b[1] > last) return;

    s += '<rect class="f-' + b[0] + '" x="' + xa.toFixed(1) + '" y="20" width="' + Math.max(4, xb - xa).toFixed(1) + '" height="3" rx="1.5"/>' +
      '<text class="bl f-' + b[0] + '" x="' + ((xa + xb) / 2).toFixed(1) + '" y="13" text-anchor="middle">' + (xb - xa > 34 ? b[3] : '') + '</text>';
    if (b[1] > 1) s += '<line class="sep" x1="' + (x(b[1]) - half).toFixed(1) + '" x2="' + (x(b[1]) - half).toFixed(1) + '" y1="' + (T - 6) + '" y2="' + (H - B) + '"/>';
  });
  var pts = [];
  for (n = 1; n <= last; n++){ var mv = num(D(n).mood); if (mv != null) pts.push({n:n, v:mv, o:D(n)}); }

  });
  if (pts.length){ var lp = pts[pts.length - 1]; s += '<text class="vl" x="' + x(lp.n).toFixed(1) + '" y="' + (y(lp.v) - 10).toFixed(1) + '" text-anchor="middle">' + lp.v + '</text>'; }
  var stepL = sp < 18 ? 2 : 1, tn = todayNum();
  for (n = 1; n <= last; n++){
    var show = n === last || ((n - 1) % stepL === 0 && !(stepL === 2 && n === last - 1));
    if (show) s += '<text class="xl' + (n === tn ? ' now' : '') + '" x="' + x(n).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + n + '</text>';
  }
  s += '</svg>';
  if (!pts.length) s += '<p class="chart-empty">1일차 밤에 하루 기분을 적으면<br>여기에 점이 찍힙니다.</p>';

  else if (a === 'ctx'){
    var c = b.dataset.ctx;
    if (c === 'back') go(returnTo.ctx, returnTo.idx, -1);
    else { if (typeof view.ctx === 'number') returnTo = {ctx:view.ctx, idx:view.idx}; go(c, 0, 1); }
  }
  else if (a === 'entry'){ view.entry[n] = +b.dataset.i; render(); }
  else if (a === 'addrow' || a === 'fillhours' || a === 'delrow'){
    E = (get(p).entries || []).map(function(x){ return x || {}; });
    if (a === 'addrow'){ var lastE = E[E.length - 1]; if (!E.length) E.push({}); E.push({time: lastE ? nextHour(lastE.time) : ''}); view.entry[n] = E.length - 1; }
    else if (a === 'fillhours'){ var first = E[0] || {}; E = []; for (var h = 8; h <= 24; h++) E.push({time: pad(h) + ':00'}); if (first.what) E[0] = first; view.entry[n] = 0; }
    else { E.splice(+b.dataset.i, 1); view.entry[n] = Math.max(0, +b.dataset.i - 1); }
    edit(p, 'entries', E, true);
  }
  else if (a === 'fill'){ edit(b.dataset.doc, b.dataset.f, b.dataset.t, true); }
  else if (a === 'flip'){ var i = +b.dataset.i; view.flipped[i] = !view.flipped[i]; render(); }
  else if (a === 'worry-add') addWorry();
  else if (a === 'worry-del'){
    var items = (get('journal/worry').items || []).filter(Boolean).slice();
    items.splice(+b.dataset.i, 1);
    edit('journal/worry', 'items', items, true);
  }
  else if (a === 'export') doExport();
  else if (a === 'why'){ view.why = true; render(); }
  else if (a === 'cmp'){ view.cmp = +b.dataset.i; render(); }
});
/* swipe */
(function(){
  var sx = null, sy = null, st = $('#stage');
  st.addEventListener('pointerdown', function(e){ var t = e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA' || e.target.closest('.tl')) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
  st.addEventListener('pointerup', function(e){
    if (sx == null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ if (dx < 0) next(); else prev(); }
  });
})();
var rz; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(function(){ if ($('#chart')) drawChart(); }, 150); });
window.addEventListener('pagehide', function(){ Object.keys(timers).forEach(function(p){ clearTimeout(timers[p]); delete timers[p]; flush(p); }); });

/* ---------- backup (standalone app) ---------- */
function doExport(){
  var data = {app:'bwnw', version:1, exportedAt:new Date().toISOString(), records:S};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '행동활성화-백업-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  var m = $('#backup-msg'); if (m) m.textContent = '백업 파일을 내려받았어요.';
}
function doImport(file){
  var r = new FileReader();
  r.onload = function(){
    var m = $('#backup-msg');
    try{
      var o = JSON.parse(r.result), rec = o && o.app === 'bwnw' ? o.records : null;
      if (!rec || typeof rec !== 'object') throw new Error('bad');
      if (!window.confirm('지금 기기의 기록을 백업 파일 내용으로 바꿀까요?')) return;
      Object.keys(S).forEach(function(k){ delete S[k]; });
      Object.keys(rec).forEach(function(k){ if (/^(journal|days)\/[A-Za-z0-9_-]+$/.test(k)) S[k] = rec[k]; });
      saveLocal(); render();
      m = $('#backup-msg'); if (m) m.textContent = '백업을 불러왔어요.';
    }catch(e){ if (m) m.textContent = '이 앱에서 내보낸 백업 파일(.json)을 골라 주세요.'; }
  };
  r.readAsText(file);
}

/* ---------- boot ---------- */
function afterLoad(){
  if (loaded) return;
  loaded = true;
  var s = get('journal/setup');
  var started = ['q0','q1','q2','goal'].some(function(k){ return s[k]; }) || (s.postponed || []).some(Boolean);
  var h = location.hash || '', m = /^#d(\d{1,2})$/.exec(h);
  if (h === '#review' || h === '#help') view.ctx = h.slice(1);
  else view.ctx = m ? Math.min(MAXDAY, +m[1]) : (started ? todayNum() : 0);
  view.idx = 0;
  Object.keys(pending).forEach(function(p){ delete pending[p]; flush(p); });
  if (mode === 'db') status('db');
  render();
}
function init(){
  $('#stage').innerHTML = '<section class="card"><div class="body center"><p class="note" style="text-align:center">불러오는 중…</p></div></section>';
  var hasClaude = window.claude && typeof window.claude.use === 'function';
  var use = hasClaude ? window.claude.use('db') : Promise.resolve(null);
  Promise.resolve(use).catch(function(){ return null; }).then(function(db){
    if (!db){ mode = 'local'; loadLocal(); status('local'); afterLoad(); return; }
    DB = db; mode = 'db';
    var got = {journal:false, days:false};
    function ready(){ if (got.journal && got.days) afterLoad(); }
    function subErr(err){ status('error', '기록을 불러오지 못했어요. 다시 열어 주세요'); }
    db.collection('journal').onSnapshot(function(snap){ applySnap('journal', snap); got.journal = true; ready(); }, subErr);
    db.collection('days').onSnapshot(function(snap){ applySnap('days', snap); got.days = true; ready(); }, subErr);
    setTimeout(afterLoad, 8000);
  });
  if (document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
init();
})();
</script>
