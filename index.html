<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
<meta name="description" content="행동활성화 14일 연습장 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비 기다리지 않기">
<title>비를 기다리지 않는 법 기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* Layout: one column (max 760px). Header with the thesis, tabs, a day strip grouped by phase,
   then the day's sheet ruled like the workbook page, with every entry written in pen ink. */
:root{
  --ground:#EDEFF3;
  --paper:#FFFFFF;
  --line:#D8DCE3;
  --line-soft:#EBEDF1;
  --text:#1D2128;
  --muted:#667080;
  --pen:#22337F;
  --pen-faint:#AAB2C6;
  --write:#3474D0;
  --choose:#2E8F55;
  --do:#DD7027;
  --review:#7F4FC4;
  --extra:#7B8391;
  --on-accent:#FFFFFF;
  --warn:#B0521A;
  --font-display:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --font-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-pen:"Nanum Pen Script","Gaegu","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14161A; --paper:#1C1F25; --line:#353A46; --line-soft:#272B33;
    --text:#E6E8EC; --muted:#9AA2AF; --pen:#B3C3FF; --pen-faint:#57617A;
    --write:#6EA4F0; --choose:#5CBB80; --do:#F0904B; --review:#AA8AE3; --extra:#8F97A5;
    --on-accent:#14161A; --warn:#F0A06A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#14161A; --paper:#1C1F25; --line:#353A46; --line-soft:#272B33;
  --text:#E6E8EC; --muted:#9AA2AF; --pen:#B3C3FF; --pen-faint:#57617A;
  --write:#6EA4F0; --choose:#5CBB80; --do:#F0904B; --review:#AA8AE3; --extra:#8F97A5;
  --on-accent:#14161A; --warn:#F0A06A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ph,var(--do));outline-offset:2px}
.muted{color:var(--muted)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap}
.top-text{min-width:0;flex:1 1 320px}
.eyebrow{margin:0 0 4px;font-size:12.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.65rem,5.4vw,2.2rem);line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:52ch;font-size:14.5px}
.status{flex:none;font-size:12.5px;color:var(--muted);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);white-space:nowrap;margin-top:4px}
.status[data-s="saved"]{color:var(--choose)}
.status[data-s="error"],.status[data-s="readonly"]{color:var(--warn);border-color:currentColor}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}

/* day strip */
.strip{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 12px;position:relative;scrollbar-width:thin}
.grp{display:flex;flex-direction:column;gap:7px;flex:none}
.g-start{--gc:var(--extra)} .g-write{--gc:var(--write)} .g-choose{--gc:var(--choose)} .g-do{--gc:var(--do)} .g-extra{--gc:var(--extra)}
.glabel{font-size:12px;font-weight:700;color:var(--gc);padding-bottom:5px;border-bottom:3px solid var(--gc);border-radius:0}
.glabel small{font-weight:400;color:var(--muted);margin-left:4px}
.chips{display:flex;gap:4px}
.chip{position:relative;width:34px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.chip:hover{border-color:var(--gc)}
.chip.has::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gc)}
.chip.today{box-shadow:inset 0 0 0 2px var(--gc)}
.chip.sel{background:var(--gc);border-color:var(--gc);color:var(--on-accent)}
.chip.sel.has::after{background:var(--on-accent)}

/* sheet */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,32px)}
.sheet[data-ph="start"],.sheet[data-ph="extra"]{--ph:var(--extra)}
.sheet[data-ph="write"]{--ph:var(--write)}
.sheet[data-ph="choose"]{--ph:var(--choose)}
.sheet[data-ph="do"]{--ph:var(--do)}
#tab-review{--ph:var(--review)}
#tab-help{--ph:var(--extra)}
.loading{color:var(--muted);margin:24px 0;text-align:center}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
.phase-tag{display:flex;align-items:center;gap:8px;color:var(--ph);font-weight:700;flex-wrap:wrap}
.pno{width:24px;height:24px;border-radius:50%;background:var(--ph);color:var(--on-accent);display:inline-grid;place-items:center;font-size:13px}
.range{color:var(--muted);font-weight:400;font-size:13px}
.today-tag{border:1px solid var(--ph);border-radius:999px;padding:0 9px;font-size:12px;line-height:20px}
.dayline{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
h2{font-family:var(--font-display);font-weight:900;font-size:clamp(1.55rem,4.6vw,2.05rem);margin:0;line-height:1.2}
.date{font-family:var(--font-pen);color:var(--pen);font-size:1.6rem;line-height:1}
.intro{color:var(--muted);margin:12px 0 18px;max-width:62ch;line-height:1.75}
.box{border:1px solid var(--line);border-radius:12px;padding:4px 18px;margin-top:14px}
.box-title{font-weight:700;margin:14px 0 6px}
.box-title small,.box-title .muted{font-weight:400;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 14px}
.field{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:8px 14px;align-items:center;padding-block:14px}
.field + .field{border-top:1px dashed var(--line)}
.flabel{font-weight:700;font-size:15px;line-height:1.4}
.flabel small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fbody{min-width:0}
.ink{font-family:var(--font-pen);font-size:1.5rem;line-height:1.3;color:var(--pen);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 2px 3px;width:100%;min-width:0}
.ink::placeholder{color:var(--pen-faint);opacity:1}
.ink:focus{outline:none;border-bottom-color:var(--ph,var(--pen));box-shadow:0 1px 0 0 var(--ph,var(--pen))}
.ink:disabled{opacity:.75}
.ink-static{font-family:var(--font-pen);font-size:1.4rem;color:var(--pen);line-height:1.3}
.date-in{max-width:14rem}
textarea.memo{resize:none;overflow:hidden;min-height:4.2rem;line-height:2.1rem;padding-top:0;border-bottom:0;
  background-image:linear-gradient(transparent calc(2.1rem - 1px),var(--line) 0);background-size:100% 2.1rem;background-attachment:local}
textarea.memo:focus{box-shadow:none}

/* 0~10 dots */
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;max-width:420px}
.dot{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;padding:0;display:grid;place-items:center}
.dot:hover{border-color:var(--ph)}
.dot.on{background:var(--ph);border-color:var(--ph);color:var(--on-accent);font-weight:700}

/* pills */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 14px 6px 10px;cursor:pointer;font-size:14.5px}
.pill::before{content:"";width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;line-height:1;flex:none}
.pill.on{border-color:var(--ph)}
.pill.on::before{content:"✓";background:var(--ph);border-color:var(--ph);color:var(--on-accent)}
.pill.sm{font-size:13px;padding:4px 10px 4px 8px}
.pill.sm::before{width:15px;height:15px;font-size:11px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line-soft)}
.qrow:first-child{border-top:1px solid var(--line)}
.callout{margin:16px 0 0;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--ph) 11%,var(--paper))}
.numline{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:end;padding-block:8px}
.nb{width:24px;height:24px;border-radius:50%;background:var(--muted);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700}

/* activity log */
.log-row{display:grid;grid-template-columns:4.4rem minmax(0,1fr) 3.1rem 3.1rem 1.9rem;gap:6px 10px;align-items:end;padding-block:5px;border-bottom:1px solid var(--line-soft)}
.log-head{font-size:12.5px;color:var(--muted);font-weight:600;align-items:end;border-bottom:1px solid var(--line);padding-bottom:8px}
.log-head span{line-height:1.25}
.log-head small{display:block;font-weight:400;font-size:11.5px}
.log-head span:nth-child(3),.log-head span:nth-child(4){text-align:center}
.num{text-align:center}
.x{border:0;background:none;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;border-radius:6px;width:28px;height:28px;padding:0}
.x:hover{color:var(--warn)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ph)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ph);border-color:var(--ph);color:var(--on-accent)}
.link{border:0;background:none;padding:0;color:var(--ph);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.top3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
.top3 h4{margin:4px 0 6px;font-size:13.5px}
.top3 ol{margin:0 0 6px;padding-left:1.2em}
.top3 li{padding:3px 0}
.meta{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* areas & ladder */
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area{display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;cursor:pointer}
.area::before{content:"";width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.area.on{border-color:var(--ph);background:color-mix(in srgb,var(--ph) 9%,var(--paper))}
.area.on::before{content:"✓";background:var(--ph);border-color:var(--ph);color:var(--on-accent)}
.area small{color:var(--muted);font-size:12.5px}
.area.wide{grid-column:1 / -1}
details.ex{margin-top:16px}
details.ex summary{cursor:pointer;font-weight:700;padding:6px 0}
details.ex summary small{font-weight:400;color:var(--muted);margin-left:6px}
.tscroll{overflow-x:auto}
.ex-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.ex-table th{text-align:left;white-space:nowrap;padding:9px 14px 9px 0;vertical-align:top;border-top:1px solid var(--line-soft)}
.ex-table td{padding:9px 0;color:var(--muted);border-top:1px solid var(--line-soft)}
.ex-table tr.on th,.ex-table tr.on td{color:var(--ph)}
.oneline{display:grid;gap:2px;margin:0 0 6px;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--ph) 9%,var(--paper))}
.oneline .flabel{font-size:12.5px;color:var(--muted);font-weight:600}
.ladder-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px 12px;align-items:end;padding-block:13px}
.ladder-row + .ladder-row{border-top:1px dashed var(--line)}
.ladder-row .nb{background:var(--ph);color:var(--on-accent)}
.checks{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.warn{grid-column:2;color:var(--warn);font-size:13px;margin:0}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;cursor:pointer}
.sno{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.stxt{font-family:var(--font-pen);font-size:1.35rem;color:var(--pen);overflow-wrap:anywhere;line-height:1.3}
.stxt .muted{font-family:var(--font-body);font-size:13px}
.step.on{border-color:var(--ph);background:color-mix(in srgb,var(--ph) 9%,var(--paper))}
.step.on .sno{background:var(--ph);border-color:var(--ph);color:var(--on-accent)}
.pair{display:flex;gap:10px 28px;flex-wrap:wrap}
.pair label{display:flex;align-items:end;gap:8px;font-weight:600;font-size:14px}
.pair .ink{width:3.2rem}
.pair span{color:var(--muted);font-weight:400}
.nav-row{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}

/* review */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,28px);margin-top:14px}
.panel h3{font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h3 small{font-weight:400;color:var(--muted);font-size:13px}
.panel-intro{color:var(--muted);margin:0 0 6px;font-size:14px}
.chart{position:relative;width:100%;min-height:260px}
.chart svg{display:block;max-width:100%}
.chart .g{stroke:var(--line-soft);stroke-width:1}
.chart .sep{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax,.chart .xl{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.chart .xl.now{fill:var(--text);font-weight:700}
.chart .bl{font-size:11.5px;font-weight:700;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.7}
.chart .pt{stroke:var(--paper);stroke-width:2}
.chart .vl{fill:var(--text);font-size:12px;font-weight:700;font-family:var(--font-body)}
.f-write{fill:var(--write)} .f-choose{fill:var(--choose)} .f-do{fill:var(--do)} .f-extra{fill:var(--extra)}
.t-write{fill:var(--write)} .t-choose{fill:var(--choose)} .t-do{fill:var(--do)} .t-extra{fill:var(--extra)}
.chart .pt.miss{fill:var(--paper);stroke:var(--extra);stroke-width:2.2}
.chart-empty{position:absolute;inset:44px 16px 30px 30px;display:grid;place-items:center;color:var(--muted);font-size:13.5px;text-align:center;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i,.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.sw-write{background:var(--write)} .sw-choose{background:var(--choose)} .sw-do{background:var(--do)} .sw-extra{background:var(--extra)}
.sw-miss{background:var(--paper);box-shadow:inset 0 0 0 2px var(--extra)}
.stat{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
.stat th,.stat td{padding:12px 10px;border-bottom:1px solid var(--line-soft);text-align:left}
.stat thead th{font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.stat td{font-family:var(--font-pen);font-size:1.45rem;color:var(--pen);text-align:center;border-left:1px solid var(--line-soft)}
.stat thead th:not(:first-child){text-align:center}
.stat td small{font-size:1.05rem}
.stat tbody th{font-weight:700}
.stat tbody th small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:4px}

/* help */
.cards{display:grid;gap:12px;margin-top:14px}
details.card{border:1.5px dashed var(--line);border-radius:14px;background:var(--paper)}
details.card summary{list-style:none;cursor:pointer;padding:20px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;align-items:center}
details.card summary::-webkit-details-marker{display:none}
.cno{grid-row:span 2;font-family:var(--font-display);font-weight:900;font-size:2rem;color:var(--muted);line-height:1}
.ctitle{font-family:var(--font-display);font-weight:900;font-size:1.3rem}
.chint{font-size:12.5px;color:var(--muted)}
details.card[open] .chint{visibility:hidden}
.cback{margin:0 22px;padding:14px 0 20px;border-top:1px dashed var(--line);line-height:1.85}
.cback p{margin:0 0 6px}
.worry-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:10px}
.worries{list-style:none;margin:14px 0 4px;padding:0}
.worries li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.worries li.empty{display:block;color:var(--muted);font-size:13.5px}
.safety p{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.7}
.safety b{color:var(--text);font-variant-numeric:tabular-nums}

@media (max-width:560px){
  .field{grid-template-columns:1fr;gap:8px}
  .qrow{grid-template-columns:1fr}
  .box{padding:2px 12px}
  .areas,.top3{grid-template-columns:1fr}
  .log-row{grid-template-columns:3.4rem minmax(0,1fr) 2.4rem 2.4rem 1.6rem;gap:4px 6px}
  .log-head{font-size:11px;white-space:nowrap;word-break:keep-all}
  .log-head small{font-size:10.5px}
  .ink{font-size:1.4rem}
  .scale{gap:3px}
  .dot{font-size:12px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-text">
      <p class="eyebrow">행동활성화 14일 연습장</p>
      <h1>비를 기다리지 않는 법</h1>
      <p class="lede">기분이 나아지면 움직이는 게 아니라, 작은 행동을 먼저 하고 그 뒤에 기분이 어떻게 달라지는지 적습니다.</p>
    </div>
    <div class="status" id="status" data-s="loading" role="status" aria-live="polite">불러오는 중</div>
  </header>

  <nav class="tabs" role="tablist" aria-label="보기">
    <button type="button" class="tab" role="tab" id="t-log" data-act="tab" data-tab="log" aria-selected="true">하루 기록</button>
    <button type="button" class="tab" role="tab" id="t-review" data-act="tab" data-tab="review" aria-selected="false">돌아보기</button>
    <button type="button" class="tab" role="tab" id="t-help" data-act="tab" data-tab="help" aria-selected="false">막힐 때</button>
  </nav>

  <section id="tab-log" role="tabpanel" aria-labelledby="t-log">
    <div class="strip" id="strip" aria-label="일차 고르기"></div>
    <article class="sheet" id="sheet" data-ph="start"><p class="loading">기록을 불러오는 중…</p></article>
  </section>
  <section id="tab-review" role="tabpanel" aria-labelledby="t-review" hidden></section>
  <section id="tab-help" role="tabpanel" aria-labelledby="t-help" hidden></section>
</div>

<script>
(function(){
'use strict';
var MAXDAY = 28;
var S = {};
var mode = 'loading';
var DB = null, loaded = false, centered = null;
var view = {tab:'log', day:0};
var LS_KEY = 'bwnw-log-v1';

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function num(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
function pad(n){ return String(n).padStart(2,'0'); }
function dayPath(n){ return 'days/d' + pad(n); }
function get(p){ return S[p] || {}; }
function doc(p){ return S[p] || (S[p] = {}); }
function D(n){ return get(dayPath(n)); }
function fid(p,f,v){ return ('f-' + p + '-' + f + (v !== undefined ? '-' + v : '')).replace(/[^A-Za-z0-9_-]/g,'-'); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ---------- dates ---------- */
var WD = '일월화수목금토';
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseISO(s){ var a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function todayISO(){ return iso(new Date()); }
function startISO(){ var s = get('journal/setup').start; return /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s : todayISO(); }
function dateOf(n){ var d = parseISO(startISO()); d.setDate(d.getDate() + n - 1); return d; }
function todayNum(){ var diff = Math.round((parseISO(todayISO()) - parseISO(startISO())) / 864e5); return Math.max(0, Math.min(MAXDAY, diff + 1)); }
function fmtDate(d){ return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일'; }
function dayLabel(n){ return n === 0 ? '시작 전' : n + '일차'; }

/* ---------- deep get/set ---------- */
function getDeep(o, path){ return path.split('.').reduce(function(a,k){ return a == null ? undefined : a[k]; }, o); }
function setDeep(o, path, val){
  var ks = path.split('.'), c = o;
  for (var i = 0; i < ks.length - 1; i++){
    var k = ks[i];
    if (c[k] == null || typeof c[k] !== 'object') c[k] = /^\d+$/.test(ks[i+1]) ? [] : {};
    c = c[k];
  }
  var last = ks[ks.length-1];
  if (Array.isArray(c)){
    c[last] = (val === undefined || val === null) ? '' : val;
    for (var j = 0; j < c.length; j++) if (c[j] === undefined) c[j] = null;
  } else if (val === '' || val === null || val === undefined) delete c[last];
  else c[last] = val;
}
function stable(v){
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

/* ---------- status ---------- */
function status(s, msg){
  var el = $('#status'); if (!el) return;
  el.dataset.s = s;
  var t = {loading:'불러오는 중', saving:'저장 중…', local:'이 기기에 저장됨', readonly:'보기 전용', error: msg || '저장하지 못했어요'};
  if (s === 'saved'){ var d = new Date(); el.textContent = '저장됨 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  else el.textContent = t[s] || '';
}

/* ---------- saving ---------- */
var timers = {}, inflight = {}, chains = {}, pending = {};
function markDirty(p){
  clearTimeout(timers[p]);
  timers[p] = setTimeout(function(){ delete timers[p]; flush(p); }, 700);
  if (mode !== 'readonly') status('saving');
}
function flush(p){
  var o = doc(p);
  o.updatedAt = new Date().toISOString();
  if (mode === 'local'){ saveLocal(); status('local'); return; }
  if (mode !== 'db'){ pending[p] = true; return; }
  var data = JSON.parse(JSON.stringify(o));
  inflight[p] = (inflight[p] || 0) + 1;
  chains[p] = (chains[p] || Promise.resolve())
    .then(function(){ return writeOnce(p, data); })
    .then(function(){ if (!Object.keys(timers).length && mode === 'db') status('saved'); }, onWriteErr)
    .then(function(){ inflight[p]--; });
}
function writeOnce(p, data){
  return DB.doc(p).set(data).catch(function(e){
    if (e && e.code === 'unavailable') return sleep(600 + Math.random()*900).then(function(){ return DB.doc(p).set(data); });
    throw e;
  });
}
function onWriteErr(e){
  var c = e && e.code;
  if (c === 'invalid_argument' || c === 'not_granted' || c === 'transform_error'){ mode = 'readonly'; status('readonly'); renderView(); }
  else if (c === 'quota_exceeded') status('error', '저장 공간이 가득 찼어요');
  else if (c === 'revoked' || c === 'capability_disabled' || c === 'capability_removed') status('error', '연결이 끊겼어요. 페이지를 새로 열어 주세요');
  else status('error', '저장하지 못했어요. 잠시 뒤 다시 적어 주세요');
}
function loadLocal(){ try{ var o = JSON.parse(lsGet(LS_KEY) || '{}'); for (var k in o) S[k] = o[k]; }catch(e){} }
function saveLocal(){ lsSet(LS_KEY, JSON.stringify(S)); }

function applySnap(col, snap){
  var changed = false;
  snap.docs.forEach(function(d){
    var p = col + '/' + d.id;
    if (timers[p] || inflight[p] || pending[p]) return;
    var data = d.data() || {};
    if (stable(data) !== stable(S[p] || null)){ S[p] = JSON.parse(JSON.stringify(data)); changed = true; }
  });
  if (changed && loaded) renderView();
}

/* ---------- edits ---------- */
function ensureStart(p){
  var s = doc('journal/setup');
  if (!s.start){ s.start = todayISO(); if (p !== 'journal/setup') markDirty('journal/setup'); }
}
function ladder(){ var L = get('journal/choose').ladder || []; return [0,1,2,3,4].map(function(i){ return L[i] || {}; }); }
function dayNumOf(p){ return parseInt(p.slice(-2), 10); }
function seedDay(p){
  var n = dayNumOf(p); if (n < 7) return;
  var o = doc(p); if (o.seeded) return;
  o.seeded = true;
  var pr = D(n-1);
  if (o.step == null && pr.nextStep != null){ o.step = pr.nextStep; if (pr.nextStepText) o.stepText = pr.nextStepText; }
  if (!o.time && pr.nextTime) o.time = pr.nextTime;
}
function effStep(n){ var o = D(n); if (o.step != null) return num(o.step); if (!o.seeded && n >= 7){ var v = num(D(n-1).nextStep); return v; } return null; }
function effTime(n){ var o = D(n); if (o.time) return o.time; if (!o.seeded && n >= 7) return D(n-1).nextTime || ''; return ''; }
function curVal(p, f){
  if (p.indexOf('days/') === 0){ var n = dayNumOf(p); if (f === 'step') return effStep(n); }
  return getDeep(get(p), f);
}
function edit(p, f, v, rerender){
  if (mode === 'readonly') return;
  ensureStart(p);
  var o = doc(p);
  if (p.indexOf('days/') === 0) seedDay(p);
  setDeep(o, f, v);
  if (f === 'step' || f === 'nextStep'){
    var L = ladder(), t = (typeof v === 'number' && L[v-1] && L[v-1].text) || '';
    setDeep(o, f + 'Text', t);
  }
  markDirty(p);
  if (rerender) renderView();
}
function parseVal(v){ if (v === 'true') return true; if (v === 'false') return false; if (/^\d+$/.test(v)) return parseInt(v, 10); return v; }
function nextHour(t){ var m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return ''; var h = +m[1] + 1; return h > 24 ? '' : pad(h) + ':' + m[2]; }

/* ---------- small builders ---------- */
function scale(p, f, cur, label){
  var h = '<div class="scale" role="group" aria-label="' + esc(label) + ' 0~10">';
  for (var i = 0; i <= 10; i++){
    var on = cur === i;
    h += '<button type="button" id="' + fid(p,f,i) + '" class="dot' + (on ? ' on' : '') + '" data-doc="' + p + '" data-f="' + f + '" data-v="' + i + '" aria-pressed="' + on + '">' + i + '</button>';
  }
  return h + '</div>';
}
function inp(p, f, val, ph, extra){
  return '<input class="ink" id="' + fid(p,f) + '" data-doc="' + p + '" data-f="' + f + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '" autocomplete="off" ' + (extra || '') + '>';
}
function numInp(p, f, val, ph, label){
  return '<input class="ink num" id="' + fid(p,f) + '" data-doc="' + p + '" data-f="' + f + '" data-type="num" inputmode="numeric" maxlength="2" value="' + (val == null ? '' : esc(val)) + '" placeholder="' + esc(ph == null ? '' : ph) + '" autocomplete="off" aria-label="' + esc(label || '0~10') + '">';
}
function memo(p, f, val, ph){
  return '<textarea class="ink memo" id="' + fid(p,f) + '" data-doc="' + p + '" data-f="' + f + '" rows="2" placeholder="' + esc(ph || '') + '">' + esc(val) + '</textarea>';
}
function pill(p, f, v, label, cur, cls){
  var on = cur === v;
  return '<button type="button" id="' + fid(p,f,String(v)) + '" class="pill' + (cls ? ' ' + cls : '') + (on ? ' on' : '') + '" data-doc="' + p + '" data-f="' + f + '" data-v="' + v + '" aria-pressed="' + on + '">' + label + '</button>';
}
function field(label, body, sub){
  return '<div class="field"><div class="flabel">' + label + (sub ? '<small>' + sub + '</small>' : '') + '</div><div class="fbody">' + body + '</div></div>';
}
function moodBox(n, memoPh){
  var p = dayPath(n), o = D(n);
  return '<div class="box">' + field('오늘 하루 기분', scale(p, 'mood', num(o.mood), '오늘 하루 기분'), '잠자기 전에') +
    field('오늘 메모', memo(p, 'memo', o.memo, memoPh || '')) + '</div>';
}
function safety(){
  return '<div class="box safety"><p class="box-title">안전 안내</p>' +
    '<p>이 연습장은 치료를 대신하지 않습니다. 기분이 2주 넘게 바닥에 머물거나 일상을 꾸리기 어려울 만큼 힘들면, 혼자 하지 말고 정신건강의학과나 상담 전문가와 함께 하세요.</p>' +
    '<p>스스로를 해치고 싶은 생각이 들면 바로 전화하세요. <b>109</b> 자살예방상담전화(24시간) · <b>1577-0199</b> 정신건강위기상담</p></div>';
}

/* ---------- phases ---------- */
function phaseOf(n){ return n === 0 ? 'start' : n <= 4 ? 'write' : n <= 6 ? 'choose' : n <= 14 ? 'do' : 'extra'; }
var PH = {
  start:{no:'', label:'시작 전', range:'0일차'},
  write:{no:'1', label:'적기', range:'1~4일'},
  choose:{no:'2', label:'고르기', range:'5~6일'},
  do:{no:'3', label:'하기', range:'7~14일'},
  extra:{no:'', label:'부록', range:'15일부터'}
};
function sheetHead(n){
  var P = PH[phaseOf(n)], isToday = n === todayNum();
  return '<header class="sheet-head"><div class="phase-tag">' + (P.no ? '<span class="pno">' + P.no + '</span>' : '') +
    '<span>' + P.label + '</span><span class="range">' + P.range + '</span>' + (isToday ? '<span class="today-tag">오늘</span>' : '') + '</div>' +
    '<div class="dayline"><h2>' + (n === 0 ? '시작하기' : n + '일차') + '</h2>' + (n > 0 ? '<span class="date">' + fmtDate(dateOf(n)) + '</span>' : '') + '</div></header>';
}
function navRow(n){
  var tn = todayNum();
  return '<div class="nav-row"><button type="button" class="btn" data-act="go" data-n="' + (n-1) + '"' + (n === 0 ? ' disabled' : '') + '>‹ ' + (n > 0 ? dayLabel(n-1) : '이전') + '</button>' +
    (n !== tn ? '<button type="button" class="btn" data-act="go" data-n="' + tn + '">오늘(' + dayLabel(tn) + ')로</button>' : '') +
    '<button type="button" class="btn" data-act="go" data-n="' + (n+1) + '"' + (n === MAXDAY ? ' disabled' : '') + '>' + (n < MAXDAY ? dayLabel(n+1) : '다음') + ' ›</button></div>';
}

/* day 0 */
var QS = ['쉬어야 힘이 날 것 같아 하루 종일 누워 있었는데 더 기운이 빠진 적 있다',
  '여유 좀 생기면 운동해야지 생각만 하고 몇 달째 시작을 못 하고 있다',
  '해야 할 일이 있어도 시작할 기분이 안 나서 스마트폰만 잡고 있던 적 있다'];
function sheet0(){
  var p = 'journal/setup', s = get(p), P = s.postponed || [];
  var h = sheetHead(0) + '<p class="intro">솔직하게 예, 아니오로 답해 보세요.</p><div>';
  QS.forEach(function(q, i){
    h += '<div class="qrow"><span>' + q + '</span><div class="pills">' + pill(p, 'q'+i, 'y', '예', s['q'+i]) + pill(p, 'q'+i, 'n', '아니오', s['q'+i]) + '</div></div>';
  });
  h += '</div>';
  if (QS.some(function(_, i){ return s['q'+i] === 'y'; }))
    h += '<p class="callout">하나라도 \'예\'라면, 우리는 같은 걸 기다리고 있는 겁니다. <b>의욕이라는 비를요.</b></p>';
  var ph = ['예) 헬스장 다시 등록하기', '예) 연락 끊긴 친구한테 먼저 연락하기', '예) 미뤄 둔 방 정리하기'];
  h += '<div class="box"><p class="box-title">기분이 나아지면 하려고 미뤄 둔 일을 세 개 적어 보세요. 작아도 됩니다.</p>';
  for (var i = 0; i < 3; i++) h += '<div class="numline"><span class="nb">' + (i+1) + '</span>' + inp(p, 'postponed.' + i, P[i], ph[i], 'aria-label="미뤄 둔 일 ' + (i+1) + '"') + '</div>';
  h += '<p class="hint">이 세 줄은 5일차에 다시 봅니다.</p></div>';
  h += '<div class="box">' + field('1일차 날짜', '<input type="date" class="ink date-in" id="' + fid(p,'start') + '" data-doc="' + p + '" data-f="start" value="' + startISO() + '">', '적기를 시작하는 날') + '</div>';
  h += safety();
  return h;
}

/* days 1~4 */
var EX = [['11:00','눈 떴는데 침대에서 안 나옴',2,1],['12:00','쇼츠',3,0],['13:00','쇼츠',2,0],['14:00','친구 카톡 확인, 답장 안 함',1,6],
  ['15:00','누워서 천장 봄',1,0],['16:00','누워 있음, 월요일 보고서 생각남',0,8],['17:00','편의점 다녀옴, 컵라면',5,4],['18:00','컵라면 먹으며 예능',6,2],
  ['19:00','예능',4,2],['20:00','샤워',6,5],['21:00','동생이랑 통화 20분',7,6],['22:00','누워서 폰',3,0],['23:00','폰',2,0],['24:00','잠','','']];
function sheetWrite(n){
  var p = dayPath(n), o = D(n), E = (o.entries || []).map(function(x){ return x || {}; });
  var h = sheetHead(n) + '<p class="intro">' + (n === 1 ? '나흘 동안은 아무것도 바꾸지 않습니다. ' : '') +
    '평소대로 지내고, 자기 전에 오늘 한 일을 시간 순서대로 적습니다. 잠, 누워 있던 시간, 쇼츠 본 시간도 빠짐없이 적습니다. 한 일마다 즐거움과 중요도를 0~10으로 매깁니다.</p>';
  h += '<div class="log"><div class="log-row log-head"><span>시간</span><span>한 일</span><span>즐거움<small>0~10</small></span><span>중요도<small>0~10</small></span><span></span></div>';
  var rows = E.length ? E : [{}];
  rows.forEach(function(e, i){
    var ex = (n === 1 || i === 0) ? (EX[i] || []) : [];
    h += '<div class="log-row">' +
      inp(p, 'entries.' + i + '.time', e.time, ex[0] || '', 'inputmode="numeric" aria-label="시간"') +
      inp(p, 'entries.' + i + '.what', e.what, ex[1] || '', 'aria-label="한 일"') +
      numInp(p, 'entries.' + i + '.joy', e.joy, ex[2], '즐거움 0~10') +
      numInp(p, 'entries.' + i + '.imp', e.imp, ex[3], '중요도 0~10') +
      (E.length ? '<button type="button" class="x" data-act="delrow" data-doc="' + p + '" data-i="' + i + '" aria-label="' + (i+1) + '번째 줄 지우기">×</button>' : '<span></span>') +
      '</div>';
  });
  h += '</div><div class="row-actions"><button type="button" class="btn" data-act="addrow" data-doc="' + p + '">+ 한 줄 추가</button>';
  if (!E.length || (E.length === 1 && !E[0].what)) h += '<button type="button" class="btn" data-act="fillhours" data-doc="' + p + '">8시~24시 칸 한 번에 만들기</button>';
  h += '</div>' + (n === 1 ? '<p class="hint">흐린 글씨는 워크북 속 고양 씨의 토요일 예시입니다.</p>' : '');
  if (n === 4) h += topBottom();
  h += moodBox(n, n === 1 ? '예) 점수 매기다 보니 즐거움이 제일 높았던 게 동생 통화랑 편의점 다녀온 거였음.' : '');
  return h;
}
function topBottom(){
  var all = [];
  for (var d = 1; d <= 4; d++) (D(d).entries || []).forEach(function(e){ if (e && e.what && num(e.joy) != null) all.push({d:d, t:e.time || '', w:e.what, j:e.joy}); });
  if (!all.length) return '<div class="box"><p class="box-title">나흘째 밤에는</p><p class="hint">1~4일차 기록에서 즐거움이 높았던 일 세 개와 낮았던 일 세 개가 여기에 모입니다.</p></div>';
  var hi = all.slice().sort(function(a,b){ return b.j - a.j; }).slice(0, 3);
  var lo = all.slice().sort(function(a,b){ return a.j - b.j; }).filter(function(x){ return hi.indexOf(x) < 0; }).slice(0, 3);
  function li(x){ return '<li><span class="ink-static">' + esc(x.w) + '</span><span class="meta">' + x.d + '일차 ' + esc(x.t) + ' · 즐거움 ' + x.j + '</span></li>'; }
  return '<div class="box"><p class="box-title">1~4일차 기록 펼쳐 보기</p><div class="top3"><div><h4>즐거움이 높았던 일</h4><ol>' + hi.map(li).join('') +
    '</ol></div><div><h4>즐거움이 낮았던 일</h4><ol>' + (lo.length ? lo.map(li).join('') : '<li class="muted">아직 없음</li>') + '</ol></div></div>' +
    '<p class="hint">높았던 일들끼리 닮은 점이 있는지 메모에 한 줄 적어 보세요.</p></div>';
}

/* day 5 */
var AREAS = [
  {k:'rel', n:'인간관계', ex:'친구에게 카톡 한 줄 보내기 · 점심시간에 옆자리 동료에게 같이 먹자고 하기 · 취미 모임 앱에서 검색해 보기'},
  {k:'work', n:'일과 공부', ex:'채용 공고 3개 저장하기 · 이력서 파일 열어서 경력 한 줄 고치기 · 오늘 배운 것 한 줄 적기'},
  {k:'leisure', n:'여가생활', ex:'유튜브에서 기타 채널 구독하기 · 옷장 위에서 기타 꺼내기 · 코드 하나만 잡아 보기'},

function drawChart(){
  var box = $('#chart'); if (!box) return;
  var W = Math.max(300, Math.floor(box.clientWidth || 640)), H = 260;
  var last = 14;
  for (var n = 15; n <= MAXDAY; n++) if (num(D(n).mood) != null) last = n;
  var Lp = 30, Rp = 16, T = 44, B = 30, iw = W - Lp - Rp, ih = H - T - B, sp = iw / (last - 1), half = sp / 2;
  function x(n){ return Lp + (n - 1) * sp; }
  function y(v){ return T + (10 - v) * ih / 10; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="1~' + last + '일차 하루 기분 그래프">';
  for (var v = 0; v <= 10; v += 2) s += '<line class="g" x1="' + Lp + '" x2="' + (W - Rp) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (Lp - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  [['write',1,4,'적기'],['choose',5,6,'고르기'],['do',7,14,'하기'],['extra',15,MAXDAY,'부록']].forEach(function(b){
    if (b[1] > last) return;
    var e = Math.min(b[2], last), xa = Math.max(Lp - 6, x(b[1]) - half + 3), xb = Math.min(W - Rp + 6, x(e) + half - 3);
    s += '<rect class="f-' + b[0] + '" x="' + xa.toFixed(1) + '" y="22" width="' + Math.max(4, xb - xa).toFixed(1) + '" height="4" rx="2"/>' +
      '<text class="bl t-' + b[0] + '" x="' + ((xa + xb) / 2).toFixed(1) + '" y="16" text-anchor="middle">' + b[3] + '</text>';
    if (b[1] > 1) s += '<line class="sep" x1="' + (x(b[1]) - half).toFixed(1) + '" x2="' + (x(b[1]) - half).toFixed(1) + '" y1="' + (T - 6) + '" y2="' + (H - B) + '"/>';
  });
  var pts = [];
  for (n = 1; n <= last; n++){ var mv = num(D(n).mood); if (mv != null) pts.push({n:n, v:mv, o:D(n)}); }
  var d = '';
  pts.forEach(function(pt, i){ var pr = pts[i-1]; d += (pr && pr.n === pt.n - 1 ? 'L' : 'M') + x(pt.n).toFixed(1) + ' ' + y(pt.v).toFixed(1); });
  if (d) s += '<path class="ln" d="' + d + '"/>';
  pts.forEach(function(pt){
    var miss = pt.n >= 7 && pt.o.done === false, did = pt.n >= 7 && pt.o.done === true;
    s += '<circle class="pt ' + (miss ? 'miss' : 'f-' + phaseOf(pt.n)) + '" cx="' + x(pt.n).toFixed(1) + '" cy="' + y(pt.v).toFixed(1) + '" r="5.5"><title>' + pt.n + '일차 · 하루 기분 ' + pt.v + (miss ? ' · 못 한 날' : did ? ' · 한 날' : '') + '</title></circle>';
  });
  if (pts.length){ var lp = pts[pts.length - 1]; s += '<text class="vl" x="' + x(lp.n).toFixed(1) + '" y="' + (y(lp.v) - 11).toFixed(1) + '" text-anchor="middle">' + lp.v + '</text>'; }
  var stepL = sp < 18 ? 2 : 1, tn = todayNum();
  for (n = 1; n <= last; n++){
    var show = n === last || ((n - 1) % stepL === 0 && !(stepL === 2 && n === last - 1));
    if (show) s += '<text class="xl' + (n === tn ? ' now' : '') + '" x="' + x(n).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + n + '</text>';
  }
  s += '</svg>';
  if (!pts.length) s += '<p class="chart-empty">1일차 밤에 하루 기분을 적으면 여기에 점이 찍힙니다.</p>';
  box.innerHTML = s;
}

  h += '</div>';
  h += '<div class="panel"><h3>고민 미뤄 두기 <small>카드 2와 같이 씁니다</small></h3>' +
    field('고민 시간', inp(p, 'time', w.time, '예) 저녁 8시, 30분', 'aria-label="고민 시간"')) +
    '<div class="worry-add"><input class="ink" id="worry-new" placeholder="떠오른 고민을 한 줄로 적고 넘기기" autocomplete="off" maxlength="200" aria-label="미뤄 둘 고민"><button type="button" class="btn primary" data-act="worry-add">적고 넘기기</button></div><ul class="worries">';
  if (!items.length) h += '<li class="empty">아직 미뤄 둔 고민이 없어요. 고민 시간이 되면 여기 적힌 것만 생각합니다.</li>';
  items.forEach(function(it, i){
    h += '<li><span class="ink-static">' + esc(it.t) + '</span><button type="button" class="x" data-act="worry-del" data-i="' + i + '" aria-label="이 고민 지우기">×</button><span class="meta">' + fmtAt(it.at) + ' 적어 둠</span></li>';
  });
  h += '</ul></div>' + backupPanel() + safety();
  $('#tab-help').innerHTML = h;
}


/* ---------- backup ---------- */
function backupPanel(){
  return '<div class="panel" id="backup"><h3>기록 백업 <small>이 기기에만 저장되니 가끔 내보내 두세요</small></h3>' +
    '<p class="panel-intro">기록은 지금 쓰는 휴대폰(브라우저)에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 내보내고, 새 기기에서 불러오세요.</p>' +
    '<div class="row-actions"><button type="button" class="btn primary" data-act="export">백업 파일 내보내기</button>' +
    '<label class="btn" for="import-file" style="display:inline-flex;align-items:center">백업 불러오기</label>' +
    '<input type="file" id="import-file" accept="application/json,.json" hidden></div>' +
    '<p class="hint" id="backup-msg" role="status"></p></div>';
}
function doExport(){
  var data = {app:'bwnw', version:1, exportedAt:new Date().toISOString(), records:S};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '비를기다리지않는법-백업-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  var m = $('#backup-msg'); if (m) m.textContent = '백업 파일을 내려받았어요.';
}
function doImport(file){
  var r = new FileReader();
  r.onload = function(){
    var m = $('#backup-msg');
    try{
      var o = JSON.parse(r.result);
      var rec = o && o.app === 'bwnw' ? o.records : null;
      if (!rec || typeof rec !== 'object') throw new Error('bad');
      if (!window.confirm('지금 기기의 기록을 백업 파일 내용으로 바꿀까요?')) return;
      Object.keys(S).forEach(function(k){ delete S[k]; });
      Object.keys(rec).forEach(function(k){ if (/^(journal|days)\/[A-Za-z0-9_-]+$/.test(k)) S[k] = rec[k]; });
      saveLocal(); centered = null; renderView();
      m = $('#backup-msg'); if (m) m.textContent = '백업을 불러왔어요.';
    }catch(e){ if (m) m.textContent = '이 파일은 불러올 수 없어요. 이 앱에서 내보낸 백업 파일(.json)을 골라 주세요.'; }
  };
  r.readAsText(file);
}
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'import-file' && e.target.files && e.target.files[0]){ doImport(e.target.files[0]); e.target.value = ''; }
});

/* ---------- render ---------- */
function autosize(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function renderView(){
  var ae = document.activeElement, id = ae && ae.id, ss = null, se = null;
  try{ ss = ae.selectionStart; se = ae.selectionEnd; }catch(e){}
  if (view.tab === 'log'){
    renderStrip();
    var sh = $('#sheet');
    sh.dataset.ph = phaseOf(view.day);
    sh.innerHTML = loaded ? sheetFor(view.day) + navRow(view.day) : '<p class="loading">기록을 불러오는 중…</p>';
  } else if (view.tab === 'review') renderReview();
  else renderHelp();
  document.querySelectorAll('textarea.memo').forEach(autosize);
  if (mode === 'readonly') document.querySelectorAll('[data-doc], [data-act="worry-add"], [data-act="worry-del"], #worry-new').forEach(function(el){ el.disabled = true; });
  if (id){
    var el = document.getElementById(id);
    if (el && el !== document.activeElement){
      try{ el.focus({preventScroll:true}); if (ss != null && el.setSelectionRange) el.setSelectionRange(ss, se); }catch(e){}
    }
  }
}
function setTab(t){
  view.tab = t;
  ['log','review','help'].forEach(function(k){
    $('#t-' + k).setAttribute('aria-selected', String(k === t));
    $('#tab-' + k).hidden = k !== t;
  });
  renderView();
}
function goDay(n){
  view.day = Math.max(0, Math.min(MAXDAY, n));
  if (view.tab !== 'log') setTab('log'); else renderView();
  var st = $('#strip').getBoundingClientRect();
  if (st.top < 0) window.scrollBy(0, st.top - 8);
}

/* ---------- events ---------- */
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.dataset || !el.dataset.doc || el.tagName === 'BUTTON') return;
  var v = el.value;
  if (el.dataset.type === 'num'){ var t = v.replace(/[^0-9]/g, ''); v = t === '' ? '' : Math.min(10, parseInt(t, 10)); }
  edit(el.dataset.doc, el.dataset.f, v, false);
  if (el.tagName === 'TEXTAREA') autosize(el);
  if (el.dataset.live === 'ladder'){ var i = +el.dataset.i, w = document.getElementById('warn-' + i); if (w) w.hidden = !ladderWarn(ladder()[i]); }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (!el.dataset || !el.dataset.doc) return;
  if (el.dataset.type === 'num'){ var v = getDeep(get(el.dataset.doc), el.dataset.f); el.value = v == null ? '' : v; }
  if (el.dataset.f === 'start') renderView();
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'worry-new' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); addWorry(); }
});
function addWorry(){
  if (mode === 'readonly') return;
  var el = $('#worry-new'); if (!el) return;
  var t = el.value.trim(); if (!t) return;
  var items = (get('journal/worry').items || []).filter(Boolean).slice();
  items.unshift({t:t, at:new Date().toISOString()});
  edit('journal/worry', 'items', items.slice(0, 200), true);
  var n = $('#worry-new'); if (n){ n.value = ''; n.focus(); }
}
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.doc && b.dataset.f){
    var v = parseVal(b.dataset.v), cur = curVal(b.dataset.doc, b.dataset.f);
    if (cur === v) v = '';
    edit(b.dataset.doc, b.dataset.f, v, true);
    return;
  }
  var a = b.dataset.act; if (!a) return;
  var p = b.dataset.doc, E;
  if (a === 'tab') setTab(b.dataset.tab);
  else if (a === 'go') goDay(+b.dataset.n);
  else if (a === 'addrow' || a === 'fillhours' || a === 'delrow'){
    E = (get(p).entries || []).map(function(x){ return x || {}; });
    if (a === 'addrow'){ var lastE = E[E.length - 1]; if (!E.length) E.push({}); E.push({time: lastE ? nextHour(lastE.time) : ''}); }
    else if (a === 'fillhours'){ E = []; for (var h = 8; h <= 24; h++) E.push({time: pad(h) + ':00'}); }
    else E.splice(+b.dataset.i, 1);
    edit(p, 'entries', E, true);
    if (a === 'addrow'){ var f = document.getElementById(fid(p, 'entries.' + (E.length - 1) + '.what')); if (f) f.focus(); }
  }
  else if (a === 'export') doExport();
  else if (a === 'worry-add') addWorry();
  else if (a === 'worry-del'){
    var items = (get('journal/worry').items || []).filter(Boolean).slice();
    items.splice(+b.dataset.i, 1);
    edit('journal/worry', 'items', items, true);
  }
});
var rz;
window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(function(){ if (view.tab === 'review') drawChart(); }, 150); });
window.addEventListener('pagehide', function(){ Object.keys(timers).forEach(function(p){ clearTimeout(timers[p]); delete timers[p]; flush(p); }); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden && loaded && view.tab === 'log') renderStrip(); });

/* ---------- boot ---------- */
function afterLoad(){
  if (loaded) return;
  loaded = true;
  var s = get('journal/setup');
  var started = ['q0','q1','q2'].some(function(k){ return s[k]; }) || (s.postponed || []).some(Boolean);
  var m = /^#d(\d{1,2})$/.exec(location.hash || '');
  view.day = m ? Math.min(MAXDAY, +m[1]) : (!started ? 0 : todayNum());
  Object.keys(pending).forEach(function(p){ delete pending[p]; flush(p); });
  if (mode === 'db') status('saved');
  var tab = (location.hash || '').slice(1);
  if (tab === 'review' || tab === 'help') setTab(tab); else setTab('log');
  if (mode === 'db') $('#status').textContent = '자동 저장';
}
function init(){
  mode = 'local'; loadLocal(); status('local'); afterLoad();
  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
}
init();
})();
</script>
</body>
</html>
